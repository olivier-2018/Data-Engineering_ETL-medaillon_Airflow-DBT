# IoT Logistics Pipeline Demo - Airflow 3 + dbt + Spark medallion pipeline
# Biel (Switzerland) warehouse scenario. See docs/ARCHITECTURE.md.
# Resource budget: ~11.3GB actual usage against a 16GB target - see docs/DEPLOYMENT.md.

services:
  # ===================================================================
  # Kafka (KRaft mode, single node - no Zookeeper) - pipeline entry point
  # ===================================================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xmx768m -Xms768m"
      # Broker-wide default retention, down from Kafka's own stock default
      # (7 days/unlimited) - Kafka here is just the pipeline's ingestion entry
      # point, not long-term storage (bronze is the durable, append-only
      # source of truth), so 24h is generous headroom, not a tight fit.
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_RETENTION_BYTES: -1
    volumes:
      - ./data-kafka/kafka-logs:/tmp/kafka-logs
      - ./data-kafka/secrets:/etc/kafka/secrets
      - ./data-kafka/config:/mnt/shared/config
      - ./data-kafka/data:/var/lib/kafka/data
    networks:
      - airflow_network
    # mem_reservation (soft target, ~matches KAFKA_HEAP_OPTS's 768m heap) vs
    # mem_limit (hard ceiling, OOM-killed if exceeded) - 1GB hard cap leaves
    # ~256m of headroom above the JVM heap for metaspace/direct buffers/page
    # cache, rather than pinning the hard limit to the exact heap size (which
    # would leave zero room for JVM/OS overhead and risk OOM under any real
    # load, per this project's own earlier OOM findings elsewhere).
    mem_reservation: 768m
    mem_limit: 1024m
    memswap_limit: 1024m
    # Measured via docker stats under real generator load: steady-state is
    # 2.6-5.2% CPU, with occasional brief bursts to ~80% (log-segment
    # flushes) - trimmed from 1.0 given this project's genuinely low data
    # volume. A burst exceeding 0.5 cores gets CFS-throttled (the flush just
    # takes a bit longer), not dropped/crashed - acceptable at this
    # throughput; revisit if flush latency ever becomes visible.
    cpus: '0.5'
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ===================================================================
  # One-shot Kafka topic provisioning - creates/widens the 8 iot.* topics
  # to config/kafka/topics.yml's configured partition count. Runs once per
  # stack startup, then exits; downstream producers/consumers depend on it
  # completing (condition: service_completed_successfully) rather than just
  # on Kafka being healthy, since Kafka's own broker-side auto-create
  # defaults to num.partitions=1 - without this gate, whichever
  # producer/consumer happened to touch a topic first would still win the
  # race and leave it single-partition. See docs/ARCHITECTURE.md.
  # ===================================================================
  kafka-init:
    build:
      context: ./config/kafka
    container_name: kafka-init
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - airflow_network
    restart: "no"

  # ===================================================================
  # Kafka UI - browse topics/partitions/consumer groups, inspect messages
  # ===================================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    ports:
      - "8089:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "false"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - airflow_network
    # UI-only, no data plane - trivial idle footprint.
    mem_limit: 384m
    memswap_limit: 384m
    cpus: '0.3'

  # ===================================================================
  # Synthetic data generator - publishes directly to Kafka, no MQTT hop
  # ===================================================================
  data-generator:
    build:
      context: ./data_generators
    container_name: data-generator
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LOG_LEVEL: ${GENERATOR_LOG_LEVEL:-INFO}  # set DEBUG for per-event tracing (main.py's own header comment)
      # Read-only, silver+reference schemas only - used solely for
      # startup state-resume reads (see redesign plan §3/§3c), never a
      # live per-tick dependency. This is the generator's first-ever DB
      # connection; it never touches iot (bronze) at all.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-iot_database}
      GENERATOR_DB_USER: ${GENERATOR_DB_USER:-generator_ro}
      GENERATOR_DB_PASSWORD: ${GENERATOR_DB_PASSWORD}
    volumes:
      - ./config/data-generators/config.yaml:/app/config.yaml:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - airflow_network
    # Was measured at ~16MB RSS/<0.1% CPU under the old flat-dict
    # implementation; re-measure via `docker stats` once the class-based
    # rewrite + DB connection are in, real usage will be higher than that.
    mem_limit: 192m
    memswap_limit: 192m
    cpus: '0.15'
    restart: unless-stopped
    # Not started automatically by `docker compose up` without an explicit
    # `docker compose up -d data-generator` / scripts/start.sh choice -
    # running synthetic load should be an intentional decision, not implicit.
    profiles: ["generator"]

  # ===================================================================
  # Spark cluster - 1 persistent Structured Streaming job (truck-position)
  # + periodic batch jobs (bronze ingestion, silver transforms)
  # ===================================================================
  spark-master:
    build:
      context: .
      dockerfile: config/spark/Dockerfile
    container_name: spark-master
    command: >
      bash -c "/opt/spark/bin/spark-class org.apache.spark.deploy.master.Master"
    ports:
      - "7077:7077"
      - "8080:8080"
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_PUBLIC_DNS=localhost
      # Postgres/Kafka connection info for psycopg2-based ingest/silver jobs.
      # Needed here (not just on the workers) because a --deploy-mode cluster
      # driver can be scheduled on any node, and client-mode jobs invoked
      # from this master's spark-submit would run their driver here too.
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-iot_database}
      - PIPELINE_DB_USER=${PIPELINE_DB_USER:-pipeline_rw}
      - PIPELINE_DB_PASSWORD=${PIPELINE_DB_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    volumes:
      - ./spark-streaming-jobs:/opt/spark-streaming-jobs:ro
      - ./spark-batch-jobs:/opt/spark-batch-jobs:ro
      - ./data-spark-logs:/opt/spark/logs
      - ./data-spark-master:/tmp/spark-data
      - ./data-spark-checkpoints:/tmp/spark-data/checkpoints
      - ./config/data-generators/config.yaml:/opt/config/config.yaml:ro
    networks:
      - airflow_network
    # With --deploy-mode cluster, driver JVMs run on workers, not here - the
    # master only coordinates, hence the much smaller footprint than before.
    mem_limit: 768m
    memswap_limit: 768m
    cpus: '0.5'
    healthcheck:
      # curl isn't installed in config/spark/Dockerfile's final image (it's
      # purged right after fetching the Kafka jars) - Python is guaranteed
      # present instead. Confirmed by testing: cluster formed correctly
      # (master elected, both workers registered) but the curl-based
      # healthcheck reported unhealthy regardless.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080').read()"]
      interval: 10s
      timeout: 5s
      retries: 5

  spark-worker-1:
    build:
      context: .
      dockerfile: config/spark/Dockerfile
    container_name: spark-worker-1
    command: >
      bash -c "/opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077"
    ports:
      - "8081:8081"
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_PUBLIC_DNS=localhost
      - SPARK_WORKER_CORES=4
      - SPARK_WORKER_MEMORY=1600m
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-iot_database}
      - PIPELINE_DB_USER=${PIPELINE_DB_USER:-pipeline_rw}
      - PIPELINE_DB_PASSWORD=${PIPELINE_DB_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    volumes:
      - ./spark-streaming-jobs:/opt/spark-streaming-jobs:ro
      - ./spark-batch-jobs:/opt/spark-batch-jobs:ro
      - ./data-spark-logs:/opt/spark/logs
      - ./data-spark-worker-1:/tmp/spark-data
      - ./data-spark-checkpoints:/tmp/spark-data/checkpoints
      - ./config/data-generators/config.yaml:/opt/config/config.yaml:ro
    depends_on:
      - spark-master
    networks:
      - airflow_network
    mem_limit: 2000m
    memswap_limit: 2000m
    cpus: '2.5'
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081').read()"]
      interval: 10s
      timeout: 5s
      retries: 5

  spark-worker-2:
    build:
      context: .
      dockerfile: config/spark/Dockerfile
    container_name: spark-worker-2
    # --webui-port 8082: without this, both workers listen on the Spark
    # default (8081) internally - only the host-side port mapping differs
    # (8082->8081) - so Master's UI, which shows each worker's own
    # self-reported "SPARK_PUBLIC_DNS:webUiPort", displayed "localhost:8081"
    # for BOTH workers (confirmed by testing). Now worker-2 actually listens
    # on 8082 internally too, so the host port mapping matches 1:1.
    command: >
      bash -c "/opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --webui-port 8082"
    ports:
      - "8082:8082"
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_PUBLIC_DNS=localhost
      - SPARK_WORKER_CORES=4
      - SPARK_WORKER_MEMORY=1600m
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-iot_database}
      - PIPELINE_DB_USER=${PIPELINE_DB_USER:-pipeline_rw}
      - PIPELINE_DB_PASSWORD=${PIPELINE_DB_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    volumes:
      - ./spark-streaming-jobs:/opt/spark-streaming-jobs:ro
      - ./spark-batch-jobs:/opt/spark-batch-jobs:ro
      - ./data-spark-logs:/opt/spark/logs
      - ./data-spark-worker-2:/tmp/spark-data
      - ./data-spark-checkpoints:/tmp/spark-data/checkpoints
      - ./config/data-generators/config.yaml:/opt/config/config.yaml:ro
    depends_on:
      - spark-master
    networks:
      - airflow_network
    mem_limit: 1500m
    memswap_limit: 1500m
    cpus: '2.5'
    healthcheck:
      # Now that --webui-port 8082 makes this container actually listen on
      # 8082 internally (see the command above), the healthcheck must target
      # 8082 too - not 8081.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082').read()"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================================================================
  # The ONE persistent Structured Streaming job (truck-position, §1a),
  # run as its own long-lived service rather than launched via Airflow.
  #
  # ARCHITECTURAL CORRECTION (found by testing, not assumed): Spark
  # Standalone does not support --deploy-mode cluster for Python
  # applications at all ("Cluster deploy mode is currently not supported
  # for python applications on standalone clusters") - this ruled out the
  # original plan of having Airflow's SparkSubmitOperator submit this job
  # in cluster mode and return immediately. Client mode's driver runs
  # wherever spark-submit is invoked from and blocks for the query's
  # entire (indefinite) lifetime - completely wrong for an Airflow task,
  # which would occupy a LocalExecutor slot forever. Running it as its own
  # docker-compose service with `restart: unless-stopped` sidesteps this
  # cleanly: Docker supervises it directly (replacing the need for
  # bronze_streaming_supervisor_dag.py to actively resubmit), and the
  # driver's client-mode process just *is* this container's main process.
  # ===================================================================
  spark-streaming-truck-position:
    build:
      context: .
      dockerfile: config/spark/Dockerfile
    container_name: spark-streaming-truck-position
    # This driver's own SparkUI (job/stage/task detail - what Spark Master's
    # "Application Detail UI" link points to) is pinned to port 4040 - the
    # sole persistent job gets the "nice" round port; every batch job (see
    # airflow-scheduler below) starts from 4041 upward. spark.driver.host
    # stays the container's Docker-network name (required for executor RPC -
    # workers must reach the driver by a real Docker-resolvable address).
    # SPARK_PUBLIC_DNS=localhost is what actually fixes the clickable link:
    # Spark's WebUI base class reports this env var (if set) as its public
    # hostname independently of spark.driver.host, so the "Application Detail
    # UI" link Master shows becomes http://localhost:4040/ - confirmed by
    # testing that these are two genuinely separate settings.
    ports:
      - "4040:4040"
    command: >
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --deploy-mode client
      --name bronze-truck-position-ingest
      --conf spark.driver.memory=512m
      --conf spark.executor.memory=512m
      --conf spark.cores.max=1
      --conf spark.driver.host=spark-streaming-truck-position
      --conf spark.ui.port=4040
      /opt/spark-streaming-jobs/ingest_truck_positions.py
    environment:
      - SPARK_PUBLIC_DNS=localhost
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-iot_database}
      - PIPELINE_DB_USER=${PIPELINE_DB_USER:-pipeline_rw}
      - PIPELINE_DB_PASSWORD=${PIPELINE_DB_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    volumes:
      - ./spark-streaming-jobs:/opt/spark-streaming-jobs:ro
      - ./data-spark-logs:/opt/spark/logs
      - ./data-spark-checkpoints:/tmp/spark-data/checkpoints
    depends_on:
      spark-master:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - airflow_network
    # This is the client-mode driver itself (not just a submitter) - it
    # needs real headroom, unlike the now-lightweight spark-master.
    mem_limit: 1024m
    memswap_limit: 1024m
    cpus: '0.5'
    restart: unless-stopped

  # ===================================================================
  # iot_database - TimescaleDB + PostGIS (bronze/silver/gold/control)
  # ===================================================================
  postgres:
    build:
      context: ./config/postgres
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-iot_database}
      PIPELINE_DB_USER: ${PIPELINE_DB_USER:-pipeline_rw}
      PIPELINE_DB_PASSWORD: ${PIPELINE_DB_PASSWORD:?PIPELINE_DB_PASSWORD must be set in .env}
      GENERATOR_DB_USER: ${GENERATOR_DB_USER:-generator_ro}
      GENERATOR_DB_PASSWORD: ${GENERATOR_DB_PASSWORD:?GENERATOR_DB_PASSWORD must be set in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data-postgres:/var/lib/postgresql/data
      - ./config/postgres/initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - airflow_network
    mem_limit: 640m
    memswap_limit: 640m
    cpus: '0.5'
    command:
      - -c
      - max_connections=50
      - -c
      - shared_buffers=128MB
      - -c
      - wal_level=minimal
      - -c
      - max_wal_senders=0
      - -c
      - synchronous_commit=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================================================================
  # Airflow 3 (LocalExecutor) - own dedicated metadata database
  # ===================================================================
  airflow-postgres:
    image: postgres:15-alpine
    container_name: airflow-postgres
    ports:
      - "5431:5432"   # only for Dev
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?AIRFLOW_DB_PASSWORD must be set in .env}
      POSTGRES_DB: ${AIRFLOW_DB_NAME:-airflow_metadata}
    volumes:
      - ./data-airflow-postgres:/var/lib/postgresql/data
    networks:
      - airflow_network
    mem_limit: 384m
    memswap_limit: 384m
    cpus: '0.25'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER:-airflow} -d ${AIRFLOW_DB_NAME:-airflow_metadata}"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    build:
      context: ./config/airflow
    container_name: airflow-init
    command: >
      bash -c "airflow db migrate"
    environment: &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__PARALLELISM: 3
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: 2
      AIRFLOW__CORE__DAG_DISCOVERY_SAFE_MODE: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-api-server:8080/execution/"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD}@airflow-postgres:5432/${AIRFLOW_DB_NAME:-airflow_metadata}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?AIRFLOW_FERNET_KEY must be set in .env}
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:?AIRFLOW_API_SECRET_KEY must be set in .env}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?AIRFLOW_JWT_SECRET must be set in .env}
      AIRFLOW_CONN_POSTGRES_IOT: postgresql://${PIPELINE_DB_USER:-pipeline_rw}:${PIPELINE_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-iot_database}
      AIRFLOW_CONN_SPARK_DEFAULT: "spark://spark%3A%2F%2Fspark-master:7077"
      OPENWEATHERMAP_API_KEY: ${OPENWEATHERMAP_API_KEY:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-iot_database}
      PIPELINE_DB_USER: ${PIPELINE_DB_USER:-pipeline_rw}
      PIPELINE_DB_PASSWORD: ${PIPELINE_DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      airflow-postgres:
        condition: service_healthy
    networks:
      - airflow_network
    mem_limit: 512m
    restart: "no"

  airflow-api-server:
    build:
      context: ./config/airflow
    container_name: airflow-api-server
    command: airflow api-server --workers 1
    ports:
      - "8090:8080"
    environment: *airflow-common-env
    depends_on:
      - airflow-init
    networks:
      - airflow_network
    # mem_limit intentionally left at 768m, not reduced further: an earlier
    # investigation (see command comment above) found even 1 worker sat
    # close to 512m under load - cutting this back risks reintroducing that
    # crash-loop. cpus trimmed based on measured steady-state usage
    # (~0.1-2% observed via docker stats, well under the previous 0.5 quota).
    mem_limit: 768m
    memswap_limit: 768m
    cpus: '0.3'
    healthcheck:
      # curl isn't installed in config/airflow/Dockerfile's final image
      # (confirmed by testing: `which curl` -> not found) - use Python
      # instead of adding a package just for the healthcheck.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v2/monitor/health').read()"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  airflow-scheduler:
    build:
      context: ./config/airflow
    container_name: airflow-scheduler
    command: airflow scheduler
    # Every client-mode SparkSubmitOperator batch job's driver JVM runs inside
    # this container, each opening its own SparkUI (job/stage/task detail).
    # Every batch job's conf pins spark.ui.port=4041 as the starting port (see
    # each DAG file) - port 4040 is reserved for the streaming job's own
    # container, so batch starts one above it and auto-increments to
    # 4042/4043 for additional concurrent jobs in this same container. The
    # ceiling of 3 concurrent ports isn't arbitrary: SPARK_WORKER_CORES=4/4
    # (8 total) minus the streaming job's permanent spark.cores.max=1 leaves 7
    # free, and every batch job also requests spark.cores.max=2, so at most 3
    # can hold executors at once regardless of how many DAGs are scheduled -
    # a 4th queues at Spark Master until a slot frees up (confirmed by
    # testing). Published so they're reachable from the host.
    # SPARK_PUBLIC_DNS=localhost below is what makes Spark Master's
    # "Application Detail UI" link actually resolve from a host browser:
    # Spark's WebUI base class reports this env var (when set) as its public
    # hostname independently of spark.driver.host (which stays this
    # container's Docker-network name, required for executor RPC) - see
    # docs/OBSERVABILITY.md.
    ports:
      - "4041-4043:4041-4043"
    environment:
      <<: *airflow-common-env
      SPARK_PUBLIC_DNS: localhost
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./spark-batch-jobs:/opt/spark-batch-jobs:ro
      - ./dbt:/opt/dbt:rw
      - ./data-airflow-logs:/opt/airflow/logs
      - ./config/data-generators/config.yaml:/opt/config/config.yaml:ro
      - ./config/airflow/airflow_config.yml:/opt/config/airflow_config.yml:ro
    depends_on:
      - airflow-init
    networks:
      - airflow_network
    # Bumped from 1536m/1.0 cpus: up to 3 batch SparkSubmitOperator tasks can
    # now run concurrently (SPARK_WORKER_CORES=4/4, streaming job takes 1,
    # 7 free / 2 per batch job -> 3 concurrent), each with its
    # own real client-mode driver JVM (not just idle-waiting) inside this
    # container.
    mem_limit: 2048m
    memswap_limit: 2048m
    cpus: '2.0'
    restart: unless-stopped

  airflow-dag-processor:
    build:
      context: ./config/airflow
    container_name: airflow-dag-processor
    command: airflow dag-processor
    environment: *airflow-common-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./data-airflow-logs:/opt/airflow/logs
      - ./config/airflow/airflow_config.yml:/opt/config/airflow_config.yml:ro
    depends_on:
      - airflow-init
    networks:
      - airflow_network
    mem_limit: 640m
    memswap_limit: 640m
    cpus: '0.5'
    restart: unless-stopped

  # ===================================================================
  # Observability: Grafana (live truck map + pipeline/gold dashboards)
  # + Loki/Promtail (lightweight log search, not Elasticsearch/Kibana)
  # + cAdvisor/Prometheus (per-container CPU/mem/health metrics) - needed
  # because Postgres/Loki alone have no way to expose container-level
  # resource/health metrics; this is the standard lightweight way to get
  # that into Grafana without a heavier stack.
  # ===================================================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    ports:
      - "8085:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg:/dev/kmsg
    networks:
      - airflow_network
    mem_limit: 200m
    memswap_limit: 200m
    cpus: '0.3'

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data-prometheus:/prometheus
    depends_on:
      - cadvisor
    networks:
      - airflow_network
    mem_limit: 300m
    memswap_limit: 300m
    cpus: '0.3'

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}
      GF_INSTALL_PLUGINS: ""
      # Substituted into provisioning/datasources/datasources.yml at startup
      # (Grafana's native ${VAR} provisioning substitution).
      POSTGRES_DB: ${POSTGRES_DB:-iot_database}
      PIPELINE_DB_USER: ${PIPELINE_DB_USER:-pipeline_rw}
      PIPELINE_DB_PASSWORD: ${PIPELINE_DB_PASSWORD}
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/etc/grafana/dashboards:ro
      - ./data-grafana:/var/lib/grafana
    depends_on:
      - postgres
    networks:
      - airflow_network
    # Measured steady-state via docker stats: ~63MB RSS, <0.2% CPU.
    mem_limit: 256m
    memswap_limit: 256m
    cpus: '0.2'

  loki:
    image: grafana/loki:3.1.0
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./config/loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - ./data-loki:/loki
    networks:
      - airflow_network
    # Measured steady-state via docker stats: ~65MB RSS, ~1% CPU (compaction
    # ring background work).
    mem_limit: 200m
    memswap_limit: 200m
    cpus: '0.2'

  promtail:
    image: grafana/promtail:3.1.0
    container_name: promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./config/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - airflow_network
    mem_limit: 100m
    memswap_limit: 100m
    cpus: '0.2'

  # ===================================================================
  # dbt-docs - static file server for `dbt docs generate`'s output
  # (dbt/target/{index.html,manifest.json,catalog.json}). Deliberately
  # split from the airflow-scheduler container that actually runs dbt
  # (generation needs the dbt CLI + a warehouse connection; serving is
  # just static files) - nginx:alpine has neither, hence the near-zero
  # mem_limit versus every other service in this file. Not started by
  # `docker compose up` - opt in via `docker compose --profile
  # documentation up -d dbt-docs`, same pattern as the generator profile.
  # dbt/target is regenerated on demand (gitignored) - if it's empty/stale,
  # regenerate first: see docs/DBT_MODEL.md §10.
  # ===================================================================
  dbt-docs:
    image: nginx:alpine
    container_name: dbt-docs
    ports:
      - "9000:80"
    volumes:
      - ./dbt/target:/usr/share/nginx/html:ro
    networks:
      - airflow_network
    mem_limit: 32m
    memswap_limit: 32m
    cpus: '0.1'
    profiles: ["documentation"]

networks:
  airflow_network:
    name: airflow_network
    driver: bridge
    external: false
