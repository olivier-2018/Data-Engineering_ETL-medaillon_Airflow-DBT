iot_gold:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | as_number }}"
      user: "{{ env_var('PIPELINE_DB_USER') }}"
      password: "{{ env_var('PIPELINE_DB_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB') }}"
      schema: gold
      threads: 2
