name: 'iot_gold'
version: '1.0.0'
config-version: 2

profile: 'iot_gold'

model-paths: ["models"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  iot_gold:
    staging:
      +materialized: view
      # No custom +schema override - these are thin dbt-native views over
      # silver.* (already Spark-written) and land in the profile's default
      # target schema (gold), prefixed stg_ by convention, rather than
      # requiring a brand-new Postgres schema just for pass-through views.
    marts:
      dimensions:
        +materialized: incremental
      facts:
        +materialized: incremental

snapshots:
  iot_gold:
    +target_schema: gold
