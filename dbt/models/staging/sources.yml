version: 2

sources:
  - name: silver
    schema: silver
    tables:
      - name: customers_current
        loaded_at_field: updated_at
        freshness:
          warn_after: {count: 10, period: minute}
          error_after: {count: 20, period: minute}
      - name: products_current
        loaded_at_field: updated_at
        freshness:
          warn_after: {count: 10, period: minute}
          error_after: {count: 20, period: minute}
      - name: purchase_orders_current
        loaded_at_field: updated_at
        freshness:
          warn_after: {count: 10, period: minute}
          error_after: {count: 20, period: minute}
      - name: product_on_orders_current
        loaded_at_field: updated_at
        freshness:
          warn_after: {count: 10, period: minute}
          error_after: {count: 20, period: minute}
      - name: invoices_current
        loaded_at_field: updated_at
        freshness:
          warn_after: {count: 10, period: minute}
          error_after: {count: 20, period: minute}
      - name: inventory_current
        loaded_at_field: updated_at
        freshness:
          warn_after: {count: 10, period: minute}
          error_after: {count: 20, period: minute}
      - name: truck_fleet_current
        loaded_at_field: updated_at
        freshness:
          warn_after: {count: 30, period: minute}
          error_after: {count: 60, period: minute}
      - name: truck_current_position
        loaded_at_field: updated_at
        freshness:
          warn_after: {count: 5, period: minute}
          error_after: {count: 15, period: minute}
  - name: reference
    schema: reference
    tables:
      - name: delivery_zones
        description: >
          Static/lookup data (§2a of the redesign plan), not event-sourced -
          no freshness check, seeded once and only rarely updated via a
          plain SQL toggle of is_active.
      - name: weather_stations
        description: >
          Static/lookup data, not event-sourced - the 5 fixed observation
          points used by fact_weather_delivery_correlation to find each
          delivery zone's nearest station. No freshness check.
  - name: iot
    schema: iot
    tables:
      - name: weather_observations
      - name: truck_position_events
      - name: purchase_order_events
        description: >
          Bronze event log, queried directly (not via silver) by
          fact_shipments for the exact in-transit->delivered transition
          timestamps per order - silver.purchase_orders_current only
          retains an order's latest status, not its full transition
          history needed for time_to_destination_seconds.
