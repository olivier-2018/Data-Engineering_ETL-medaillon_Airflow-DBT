version: 2

models:
  - name: fact_sales_orders
    columns:
      - name: order_id
        data_tests: [not_null, unique]
      - name: customer_key
        data_tests:
          - relationships:
              to: ref('dim_customer')
              field: customer_key
      - name: product_key
        data_tests:
          - relationships:
              to: ref('dim_product')
              field: product_key
      - name: order_status
        data_tests:
          - accepted_values:
              values: ['pending', 'confirmed', 'picking', 'ready_for_dispatch', 'shipped', 'delivered', 'cancelled']

  - name: fact_payments
    columns:
      - name: order_id
        data_tests: [not_null, unique]
      - name: payment_status
        data_tests:
          - accepted_values:
              values: ['authorized', 'captured', 'failed', 'refunded']

  - name: fact_shipments
    columns:
      - name: shipment_id
        data_tests: [not_null, unique]
      - name: destination_country_key
        data_tests:
          - relationships:
              to: ref('dim_destination_country')
              field: country_code

  - name: fact_inventory_snapshot
    columns:
      - name: product_id
        data_tests: [not_null]

  - name: fact_weather_delivery_correlation
    columns:
      - name: shipment_id
        data_tests: [not_null, unique]
