[project]
name = "iot-logistics-pipeline"
version = "0.1.0"
description = "Local demo: Airflow 3 + dbt + Spark medallion pipeline for a simulated Biel warehouse/logistics scenario"
requires-python = ">=3.12"
dependencies = [
    "kafka-python==2.0.2",
    "pyyaml==6.0.2",
    "psycopg2-binary==2.9.9",
    "dbt-core==1.8.8",
    "dbt-postgres==1.8.2",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
]

[tool.uv]
package = false
